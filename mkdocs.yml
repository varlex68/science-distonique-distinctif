site_name: Science du Distonique Distinctif & Infomécanodynamique
site_description: Portail officiel d'Alexandre Vallerand (VarleX) — Cybernétique de second ordre, Protocole VarleX et Causalité Formelle.
site_author: Alexandre Vallerand (VarleX)
site_url: https://varlex.org

theme:
  name: material
  language: fr
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Le Manifeste: index.md
  - Publications & arXiv: publications.md
  - Protocole VarleX: protocole.md
  - Á propos: about.md
